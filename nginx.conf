# Nginx reverse-proxy config for sh-checker-api
# Place this file at: /etc/nginx/sites-available/sh-checker-api
# Then: ln -s /etc/nginx/sites-available/sh-checker-api /etc/nginx/sites-enabled/

upstream sh_checker_backend {
    server 127.0.0.1:5002;
    keepalive 32;
}

server {
    listen 80;
    server_name _;   # Replace _ with your domain or VPS IP

    # Optional: redirect HTTP → HTTPS (uncomment after setting up SSL with certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://sh_checker_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — must exceed gunicorn's 120s
        proxy_read_timeout 130s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;

        # Buffer tuning
        proxy_buffering    off;
        proxy_buffer_size  4k;
    }

    location /health {
        proxy_pass http://sh_checker_backend/health;
        access_log off;
    }
}

