services:
  - type: web
    name: sh-checker-api
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 10000
      - key: WORKERS
        value: 2
      # If you have secrets from your .env.example, add them here:
      # - key: API_KEY
      #   value: ""
    autoDeploy: true
